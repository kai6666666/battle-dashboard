name: tests-nightly
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches:
      - feat/refactor-x
    paths-ignore:
      - dist/**
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Run test harness
        run: node tests/run.js dist/骰子系统/stable.js
      - name: Guardrails
        run: node scripts/guardrails/check-guardrails.mjs
